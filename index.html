<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Интерактивный тренажёр по проектированию квартир"><title>PlannerGym — тренажёр планировок</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#182c26;font:15px system-ui,sans-serif}header{background:#13352c;color:white;padding:18px max(24px,calc((100vw - 1260px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px;letter-spacing:-1px}header span{color:#bdccbd;font-size:13px}main{max-width:1308px;margin:auto;padding:36px 24px}h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.055em;margin:10px 0}h2{font-size:18px;margin:0 0 12px}p{line-height:1.5;color:#50655a;margin:8px 0 18px}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}select,button{font:inherit;color:inherit;border:1px solid #cbd2c7;background:white;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #228060;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.layout{display:grid;grid-template-columns:225px minmax(0,1fr) 255px;gap:14px;align-items:start}.card{background:white;border:1px solid #dedfd6;border-radius:14px;padding:17px}.palette{display:grid;gap:7px}.palette button{display:flex;align-items:center;gap:8px;text-align:left;font-size:14px}.palette button[aria-pressed=true]{outline:2px solid #285947;border-color:transparent}.swatch{width:13px;height:13px;border-radius:3px;flex:none}.bar,.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bar small,.legend,small{color:#52665b}.board{background:#eff1e9;border-radius:9px;padding:20px 18px 12px;margin:12px 0}.facade{text-align:center;color:#3e6576;letter-spacing:.12em;font-size:11px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));border:3px solid #233c33;touch-action:none}.cell{aspect-ratio:1;padding:0;border:0;border-radius:0;box-shadow:inset 0 0 0 .5px #203f3033;background:#fffef9;font-size:clamp(7px,1vw,12px);font-weight:650;min-width:0}.cell:focus-visible{outline-offset:-3px;z-index:1}.cell.window{border-top:4px solid #4597b4}.cell.entry{border-bottom:4px solid #c07641}.legend{margin:8px 0 0;font-size:12px}.score{font-size:46px;font-weight:750;letter-spacing:-.09em;color:#174a39}.score small{font-size:16px;letter-spacing:0;margin-left:5px}.track{height:8px;border-radius:8px;background:#e8ede4;overflow:hidden;margin:8px 0 15px}.fill{height:100%;background:#387e63}.checks{padding:0;list-style:none;margin:0}.checks li{display:flex;justify-content:space-between;gap:6px;padding:9px 0;border-bottom:1px solid #edf0e9;font-size:13px}.checks b{white-space:nowrap}.primary{background:#174a39;color:white;border-color:#174a39}.info{font-size:13px;margin-bottom:0}.tag{font-size:12px;font-weight:700;letter-spacing:.12em;color:#346d56}.status{min-height:1.5em;margin:10px 0 0;font-size:13px}.sample{margin-top:10px;width:100%}@media(max-width:1000px){.layout{grid-template-columns:175px minmax(0,1fr)}.results{grid-column:2}.board{padding:12px}}@media(max-width:650px){main{padding:22px 12px}.intro{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.results{grid-column:auto}.palette{display:flex;flex-wrap:wrap}.palette button{padding:6px 8px}.card{padding:12px}.cell{font-size:9px}}
</style>
<header><strong>PlannerGym</strong><span>Тренажёр планировок</span></header>
<main><div class="intro"><div><div class="tag">ПРОЕКТИРОВАНИЕ КВАРТИР</div><h1 id="title"></h1><p id="brief"></p></div><label>Задание<br><select id="scenario"></select></label></div>
<div class="layout"><section class="card"><h2>Помещения</h2><div class="palette" id="palette"></div><p class="info">Выберите помещение и закрасьте клетки. Каждая клетка — 1 м².</p></section>
<section class="card"><div class="bar"><h2>План квартиры</h2><small id="dimensions"></small></div><div class="board"><div class="facade">ФАСАД · ОКНА</div><div class="grid" id="grid"></div><p class="legend">Синим отмечены окна, оранжевым — вход.</p></div><div class="actions"><div><button id="undo">Отменить</button> <button id="clear">Очистить</button></div><button id="train" class="primary">Запустить агента</button></div><p id="status" class="status" role="status"></p></section>
<aside class="card results"><h2>Оценка планировки</h2><div class="score" id="score"></div><div class="track"><div class="fill" id="fill"></div></div><ul class="checks" id="checks"></ul><button class="sample" id="example">Показать пример</button><p class="info">Агент пробует менять план по одной клетке. Награда за шаг — изменение оценки.</p></aside></div></main>
<script>
const rooms = [
  ['Ластик','', '#fffef9'], ['Спальня','С','#d4dcea'], ['Детская','Д','#f6d9a5'],
  ['Кухня-гостиная','КГ','#c2dfc2'], ['Санузел','СУ','#c5e3e9'], ['Прихожая','П','#eadccc'],
  ['Кабинет','К','#ead0df']
]
const scenarios = [
  {title:'Квартира для семьи из трёх', brief:'Двое взрослых и ребёнок. Нужны две отдельные спальни и общая кухня-гостиная.', w:10,h:7,entry:4, ids:[1,2,3,4,5], min:[0,12,10,18,4,4], light:[1,2,3], sample:['1112223333','1112223333','1112223333','1112253333','1115553333','4445553333','4445553333']},
  {title:'Квартира для пары', brief:'Двое взрослых, один работает из дома. Нужны спальня, кабинет с окном и кухня-гостиная.',w:9,h:6,entry:4,ids:[1,6,3,4,5],min:[0,11,0,15,4,4,6],light:[1,6,3],sample:['111663333','111663333','111663333','111553333','444553333','444553333']},
  {title:'Первая квартира', brief:'Один человек. Разместите отдельную спальню, кухню-гостиную, санузел и прихожую.',w:8,h:5,entry:3,ids:[1,3,4,5],min:[0,9,0,14,4,4],light:[1,3],sample:['11133333','11133333','11153333','44553333','44553333']}
]
const $ = id => document.getElementById(id)
function neighbors(i,w,n) {
  const a=[]
  if(i%w) a.push(i-1)
  if(i%w<w-1) a.push(i+1)
  if(i>=w) a.push(i-w)
  if(i+w<n) a.push(i+w)
  return a
}
function evaluate(plan,s) {
  const groups = rooms.map(() => [])
  plan.forEach((v,i)=>groups[v].push(i))
  const all = s.ids.every(id=>groups[id].length)
  let connected=0, access=0
  for(const id of s.ids) {
    const cells=groups[id]
    if(!cells.length) continue
    const stack=[cells[0]], seen=new Set(stack)
    while(stack.length) {
      for(const j of neighbors(stack.pop(),s.w,plan.length)) {
        if(plan[j]===id && !seen.has(j)){seen.add(j);stack.push(j)}
      }
    }
    if(seen.size===cells.length) connected++
    if(id!==5 && cells.some(i=>neighbors(i,s.w,plan.length).some(j=>plan[j]===5))) access++
  }
  const entry=(s.h-1)*s.w+s.entry
  const rows=[
    ['Площадь комнат',25,s.ids.reduce((sum,id)=>sum+Math.min(1,groups[id].length/s.min[id]),0)/s.ids.length],
    ['Окна в жилых зонах',20,s.light.filter(id=>groups[id].some(i=>i<s.w)).length/s.light.length],
    ['Цельные помещения',20,connected/s.ids.length],
    ['Доступ из прихожей',20,access/(s.ids.length-1)],
    ['Прихожая у входа',10,Number(plan[entry]===5)],
    ['Использование площади',5,Number(Boolean(all))*(1-groups[0].length/plan.length)]
  ].map(([label,max,fraction])=>({label,max,value:max*fraction}))
  return {rows, total:rows.reduce((sum,row)=>sum+row.value,0)}
}
function step(plan,s,{index,room}) {
  if(!Number.isInteger(index)||index<0||index>=plan.length||![0,...s.ids].includes(room)) throw new RangeError('Недопустимое действие')
  const next=plan.slice()
  next[index]=room
  const score=evaluate(next,s).total
  return {observation:next,reward:score-evaluate(plan,s).total,terminated:score>=100-1e-8}
}
const reset = scenario => Array(scenario.w*scenario.h).fill(0)
window.PlannerGym = {scenarios,reset,step,evaluate}
let current=0,s=scenarios[0],plan=reset(s), brush=1, history=[], dragging=false, run=0, training=false
const scenario=$('scenario')
scenarios.forEach((item,i)=>scenario.add(new Option(item.title,i)))
function stop(){run++;training=false;$('train').textContent='Запустить агента'}
function checkpoint(){history.push(plan.slice());if(history.length>100)history.shift()}
function render() {
  Array.from($('grid').children).forEach((el,i)=>{
    const [name,abbr,color]=rooms[plan[i]]
    el.textContent=abbr
    el.style.background=color
    el.setAttribute('aria-label',`Строка ${Math.floor(i/s.w)+1}, клетка ${i%s.w+1}: ${plan[i]?name:'пусто'}`)
  })
  const {rows,total}=evaluate(plan,s)
  const formatted=Math.floor(total*10+1e-8)/10
  $('score').innerHTML=`${formatted.toLocaleString('ru')}<small>/ 100</small>`
  $('fill').style.width=total+'%'
  $('checks').replaceChildren(...rows.map(({label,max,value})=>{
    const row=document.createElement('li'), points=document.createElement('b')
    points.textContent=`${(Math.floor(value*10+1e-8)/10).toLocaleString('ru')} / ${max}`
    row.append(label,points)
    return row
  }))
  $('undo').disabled=!history.length
}
function paint(i){if(plan[i]===brush)return;plan[i]=brush;render()}
function setup() {
  stop(); s=scenarios[current]; plan=reset(s); history=[]; brush=s.ids[0]
  $('title').textContent=s.title; $('brief').textContent=s.brief
  $('dimensions').textContent=`${s.w} × ${s.h} м · ${s.w*s.h} м²`
  $('status').textContent=''
  $('palette').replaceChildren(...[...s.ids,0].map(id=>{
    const button=document.createElement('button'), swatch=document.createElement('span')
    swatch.className='swatch';swatch.style.background=rooms[id][2]
    button.dataset.room=id;button.setAttribute('aria-pressed',String(id===brush))
    button.append(swatch,id ? rooms[id][0]+' · '+s.min[id]+' м²' : rooms[id][0])
    button.onclick=()=>{brush=id;for(const el of $('palette').children)el.setAttribute('aria-pressed',String(Number(el.dataset.room)===id))}
    return button
  }))
  $('grid').style.setProperty('--columns',s.w)
  $('grid').replaceChildren(...plan.map((_,i)=>{
    const button=document.createElement('button')
    button.className='cell'+(i<s.w?' window':'')+(i===(s.h-1)*s.w+s.entry?' entry':'')
    button.dataset.i=i
    button.onpointerdown=e=>{if(e.button!==0)return;stop();checkpoint();dragging=true;paint(i)}
    button.onclick=e=>{if(e.detail===0){stop();checkpoint();paint(i)}}
    return button
  }))
  render()
}
window.addEventListener('pointerup',()=>{dragging=false})
window.addEventListener('pointercancel',()=>{dragging=false})
$('grid').onpointermove=e=>{
  if(!dragging)return
  const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell')
  if(cell)paint(Number(cell.dataset.i))
}
scenario.onchange=()=>{current=Number(scenario.value);setup()}
$('undo').onclick=()=>{stop();plan=history.pop();$('status').textContent='';render()}
$('clear').onclick=()=>{stop();checkpoint();plan=reset(s);$('status').textContent='План очищен.';render()}
$('example').onclick=()=>{stop();checkpoint();plan=[...s.sample.join('')].map(Number);$('status').textContent='Пример можно редактировать.';render()}
$('train').onclick=()=>{
  if(training){stop();$('status').textContent='Агент остановлен.';return}
  checkpoint();training=true;$('train').textContent='Остановить агента'
  const token=++run
  let candidate=plan.slice(), best=plan.slice(), bestScore=evaluate(best,s).total, iterations=0
  const limit=18000
  function batch(){
    if(token!==run)return
    for(let k=0;k<300&&iterations<limit&&bestScore<100-1e-8;k++,iterations++){
      const index=Math.floor(Math.random()*plan.length)
      const adjacent=neighbors(index,s.w,plan.length)
      const randomRooms=[0,...s.ids]
      const room=Math.random()<.85?candidate[adjacent[Math.floor(Math.random()*adjacent.length)]]:randomRooms[Math.floor(Math.random()*randomRooms.length)]
      if(room===candidate[index])continue
      const {observation,reward}=step(candidate,s,{index,room})
      const temperature=1.15*(1-iterations/limit)+.035
      if(reward>=0||Math.random()<Math.exp(reward/temperature)){
        candidate=observation
        const value=evaluate(candidate,s).total
        if(value>bestScore){best=candidate;bestScore=value}
      }
    }
    plan=best.slice();render()
    const done=iterations>=limit||bestScore>=100-1e-8
    $('status').textContent=`${done?'Поиск завершён':'Агент ищет планировку'} · ${iterations.toLocaleString('ru')} попыток`
    if(done)stop()
    else requestAnimationFrame(batch)
  }
  requestAnimationFrame(batch)
}
setup()
</script></html>
